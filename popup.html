<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NFX Wallet</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="root">
        <header>
            <h2>NFX Wallet</h2>
        </header>
        
        <div class="balance">
            <div>Address: <span id="address">Not connected</span></div>
            <div>Balance: <span id="balance">0 NFX</span></div>
        </div>
        
        <div class="section">
            <h4>Tokens</h4>
            <div id="tokens-list"></div>
        </div>
        
        <div class="section">
            <h4>NFTs</h4>
            <div id="nfts-list"></div>
        </div>
        
        <div class="section">
            <h4>Islands</h4>
            <div id="islands-list"></div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
